name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-contracts:
    name: Python contract suite
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Java for launcher policy checks
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Python contract tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build -Force | Out-Null
          python -m pytest tests -q

  windows-native:
    name: Windows native runtime build
    runs-on: windows-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Set up JDK headers
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native-job test dependencies
        run: python -m pip install -r requirements-dev.txt pyinstaller==6.22.3

      - name: Build and validate shared graphics package
        shell: pwsh
        run: python tools/build_graphics.py --generator 'Visual Studio 17 2022'

      - name: Build the Rust NES player library
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = "build/rust-nes-target"
          cargo build --release --manifest-path rust-nes/Cargo.toml -p mesen-player

      - name: Run Rust core and native graphics checks
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = "build/rust-nes-target"
          cargo test --release --manifest-path rust-nes/Cargo.toml -p mesen-player
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release --manifest-path rust-nes/Cargo.toml -p mesen-core pose::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q tests/test_nes_rust.py tests/test_runtime_package.py

      - name: Compile Java player and prepare portable dependencies
        run: python tools/build.py

      - name: Build and check the default portable app
        shell: pwsh
        run: |
          python tools/package_windows.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $package = 'build/windows-release/Pixel-Revival-Windows-x64-preview.zip'
          Expand-Archive -LiteralPath $package -DestinationPath build/package-smoke -Force
          $process = Start-Process -FilePath 'build/package-smoke/Pixel Revival/Pixel Revival.exe' -ArgumentList '--check-runtime' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Packaged runtime dependency check failed.' }
