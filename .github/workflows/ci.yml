name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-contracts:
    name: Python contract suite
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Java for launcher policy checks
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Python contract tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build -Force | Out-Null
          python -m pytest tests -q

  windows-native:
    name: Windows native runtime build
    runs-on: windows-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Set up JDK headers
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native-job test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build and validate shared graphics package
        shell: pwsh
        run: python tools/build_graphics.py --generator 'Visual Studio 17 2022'

      - name: Build the Rust NES player library
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = "build/rust-nes-target"
          cargo build --release --manifest-path rust-nes/Cargo.toml -p mesen-player

      - name: Run Rust core and native graphics checks
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = "build/rust-nes-target"
          cargo test --release --manifest-path rust-nes/Cargo.toml -p mesen-player
          python -m pytest -q tests/test_nes_rust.py tests/test_runtime_package.py
